# Production deployment on the shared server (/opt/adm).
# Exposed only through the shared Caddy (network "proxy" = nurbozor_default),
# which proxies a12.uz -> adm:3000 (and alias webpul-web:3000).
name: adm

services:
  adm:
    container_name: adm
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: https://a12.uz
    restart: unless-stopped
    # Secrets (DECART_API_KEY, HF_TOKEN) live in deploy/.env on the server, never in git
    env_file:
      - path: .env
        required: false
    networks:
      proxy:
        aliases: [adm, webpul-web]

networks:
  proxy:
    external: true
    name: nurbozor_default

