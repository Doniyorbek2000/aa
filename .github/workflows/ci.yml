name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: webpul
          POSTGRES_PASSWORD: webpul_ci
          POSTGRES_DB: webpul
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U webpul"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://webpul:webpul_ci@localhost:5432/webpul
      SHADOW_DATABASE_URL: postgresql://webpul:webpul_ci@localhost:5432/webpul_shadow
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
      PGPASSWORD: webpul_ci
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:check

      - name: Apply migrations
        run: pnpm db:deploy

      - name: Migrations match schema (drift check)
        run: |
          psql -h localhost -U webpul -d webpul -c "CREATE DATABASE webpul_shadow"
          pnpm --filter @webpul/db exec prisma migrate diff \
            --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code

      - name: audit_logs is append-only
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U webpul -d webpul \
            -c "INSERT INTO audit_logs (id, action, entity_type) VALUES (gen_random_uuid(), 'ci.test', 'ci')"
          for sql in "UPDATE audit_logs SET action = 'x'" "DELETE FROM audit_logs" "TRUNCATE audit_logs"; do
            if psql -v ON_ERROR_STOP=1 -h localhost -U webpul -d webpul -c "$sql" 2>/dev/null; then
              echo "::error::'$sql' succeeded on audit_logs"; exit 1
            fi
          done

      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
