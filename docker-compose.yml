# Local development services. Ports bind to 127.0.0.1 only.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-webpul}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webpul_dev}
      POSTGRES_DB: ${POSTGRES_DB:-webpul}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # Postgres 18 images keep PGDATA under /var/lib/postgresql/<major>/
      - pgdata:/var/lib/postgresql
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
